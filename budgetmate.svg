<svg xmlns="http://www.w3.org/2000/svg" width="410" height="300" viewBox="0 0 410 300" role="img" aria-label="BudgetMate">
<style>
.c{animation:in .8s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chip{opacity:0;animation:fade .5s ease-out forwards}
@keyframes fade{to{opacity:1}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.6s cubic-bezier(.2,.8,.2,1) .6s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 1.8s ease-out infinite}
@keyframes p{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
.shine{animation:sh 4s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-200px)}60%,100%{transform:translateX(610px)}}
.num{opacity:0;animation:fade .6s ease-out 1.4s forwards}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F2B84B"/><stop offset="1" stop-color="#F2B84B" stop-opacity=".25"/></linearGradient><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#F2B84B" stop-opacity=".22"/><stop offset="1" stop-color="#F2B84B" stop-opacity="0"/></radialGradient><clipPath id="r"><rect width="410" height="300" rx="16"/></clipPath></defs>
<g class="c" clip-path="url(#r)">
<rect width="410" height="300" fill="#0D1526"/>
<rect width="410" height="300" fill="url(#glow)"/>
<rect width="410" height="4" fill="url(#g)"/><rect class="shine" x="0" y="0" width="120" height="4" fill="url(#sh)"/>
<rect x=".5" y=".5" width="409" height="299" rx="15.5" fill="none" stroke="#24385E"/>
<text x="24" y="36" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#F2B84B">PROJET ESEO · MOBILE ANDROID</text>
<rect x="296" y="21" width="90" height="22" rx="11" fill="#F2B84B" fill-opacity=".12" stroke="#F2B84B" stroke-opacity=".5"/>
<circle class="pulse" cx="309" cy="32" r="4" fill="#F2B84B"/><circle cx="309" cy="32" r="4" fill="#F2B84B"/>
<text x="320" y="37" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F2B84B">En cours</text>
<text x="24" y="68" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F6FC">BudgetMate</text>
<text x="24" y="90" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA3C4">Budget étudiant · binôme · oct. 2026 – auj.</text>
<text x="24" y="116" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" fill="#D3DCEB">Une appli pour savoir en un coup d'œil</text>
<text x="24" y="137" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" fill="#D3DCEB">combien il reste à dépenser ce mois-ci.</text>
<g class="chip" style="animation-delay:0.30s"><rect x="24" y="150" width="66" height="24" rx="12" fill="#14213D" stroke="#2E4A7A"/><text x="57.0" y="166" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#C9D6EC">Kotlin</text></g>
<g class="chip" style="animation-delay:0.42s"><rect x="98" y="150" width="133" height="24" rx="12" fill="#14213D" stroke="#2E4A7A"/><text x="164.5" y="166" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#C9D6EC">Jetpack Compose</text></g>
<g class="chip" style="animation-delay:0.54s"><rect x="239" y="150" width="51" height="24" rx="12" fill="#14213D" stroke="#2E4A7A"/><text x="264.5" y="166" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#C9D6EC">Room</text></g>
<g class="chip" style="animation-delay:0.66s"><rect x="298" y="150" width="51" height="24" rx="12" fill="#14213D" stroke="#2E4A7A"/><text x="323.5" y="166" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#C9D6EC">Hilt</text></g>
<g class="chip" style="animation-delay:0.78s"><rect x="24" y="182" width="81" height="24" rx="12" fill="#14213D" stroke="#2E4A7A"/><text x="64.5" y="198" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#C9D6EC">Firebase</text></g>
<rect x="24.0" y="214" width="114.0" height="44" rx="10" fill="#111C33" stroke="#22365A"/>
<text class="num" x="81.0" y="234" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2B84B">Figma</text>
<text x="81.0" y="250" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#8FA3C4">maquettes</text>
<rect x="148.0" y="214" width="114.0" height="44" rx="10" fill="#111C33" stroke="#22365A"/>
<text class="num" x="205.0" y="234" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2B84B">Auth</text>
<text x="205.0" y="250" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#8FA3C4">terminée</text>
<rect x="272.0" y="214" width="114.0" height="44" rx="10" fill="#111C33" stroke="#22365A"/>
<text class="num" x="329.0" y="234" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2B84B">Écrans</text>
<text x="329.0" y="250" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#8FA3C4">en cours</text>
</g></svg>